<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#222}</style><text x="24" y="30" font-size="18" font-weight="bold">Step-100 structural diagnostic counts (n=29)</text><line x1="90" y1="70" x2="885" y2="70" stroke="#666"/><rect x="115" y="-38.0" width="150" height="108.0" fill="#157a78" opacity=".85"/><text x="190.0" y="-46.0" text-anchor="middle" font-size="18">9</text><text x="190.0" y="92" text-anchor="middle" font-size="11">success</text><rect x="310" y="-170.0" width="150" height="240.0" fill="#b24b40" opacity=".85"/><text x="385.0" y="-178.0" text-anchor="middle" font-size="18">20</text><text x="385.0" y="92" text-anchor="middle" font-size="11">failure</text><rect x="505" y="34.0" width="150" height="36.0" fill="#b47b1c" opacity=".85"/><text x="580.0" y="26.0" text-anchor="middle" font-size="18">3</text><text x="580.0" y="92" text-anchor="middle" font-size="11">success + repeated</text><text x="580.0" y="108" text-anchor="middle" font-size="11">action candidate</text><rect x="700" y="22.0" width="150" height="48.0" fill="#7d4ca4" opacity=".85"/><text x="775.0" y="14.0" text-anchor="middle" font-size="18">4</text><text x="775.0" y="92" text-anchor="middle" font-size="11">failure + 100%</text><text x="775.0" y="108" text-anchor="middle" font-size="11">coverage</text><text x="25" y="362" font-size="11">The repeated-action and 100%-coverage bars are lexical/behavioral diagnostics, not proof of reward hacking.</text></svg>